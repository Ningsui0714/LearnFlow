/* ================= 右栏对话 ================= */
function setChatContext(title, sub){
  $("chatHeadTitle").textContent = title || "学习助手";
  $("chatHeadSub").textContent = sub || "";
}
function activeConversationKey(){
  if (state.draftingProject || !state.currentProjectId) return "draft";
  return "project:" + state.currentProjectId;
}
function ensureConversation(key){
  if (!state.conversations[key]) state.conversations[key] = { key: key, projectId: null, messages: [], suggestions: [], initialized: false, busy: false };
  return state.conversations[key];
}
function addMsg(role, html){
  var key = activeConversationKey();
  var conv = ensureConversation(key);
  conv.messages.push({ role: role, html: html });
  if (key === state.activeConversationKey || !state.activeConversationKey){
    appendMsgDom(role, html);
  }
}
function appendMsgDom(role, html){
  var box = $("chatMessages");
  var wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "me" : "ai");
  wrap.innerHTML = '<div class="who">' + (role === "user" ? "我" : "知行课径") + '</div><div class="bubble">' + html + '</div>';
  box.appendChild(wrap);
  icons();
  scrollChat();
}
function scrollChat(){
  var box = $("chatMessages");
  box.scrollTop = box.scrollHeight;
}
function renderConversation(){
  var key = activeConversationKey();
  var conv = ensureConversation(key);
  $("chatMessages").innerHTML = "";
  conv.messages.forEach(function(m){ appendMsgDom(m.role, m.html); });
  renderSuggestions(conv.suggestions);
}
function renderSuggestions(list){
  var box = $("chatSuggestions");
  box.innerHTML = (list || []).map(function(s){
    return '<button class="suggest-chip">' + escapeHtml(typeof s === "string" ? s : (s.label || s.prompt || "")) + '</button>';
  }).join("");
  box.querySelectorAll(".suggest-chip").forEach(function(el, i){
    el.addEventListener("click", function(){
      var s = list[i];
      var v = typeof s === "string" ? s : (s.prompt || s.label || s);
      $("chatInput").value = v;
      sendChat();
    });
  });
}
function setSuggestions(list){
  var key = activeConversationKey();
  ensureConversation(key).suggestions = list || [];
  if (key === state.activeConversationKey || !state.activeConversationKey) renderSuggestions(list);
}
function clearConversation(){
  var key = activeConversationKey();
  var conv = ensureConversation(key);
  conv.messages = [];
  conv.suggestions = [];
  $("chatMessages").innerHTML = "";
  renderSuggestions([]);
  if (state.currentProjectId){
    addMsg("ai", "<p>对话已清空。有什么想学的，或想对当前项目提问，直接说。</p>");
  } else {
    addMsg("ai", "<p>说出你想学什么，我来帮你建项目。</p>");
  }
}
async function loadConversation(projectId){
  var key = "project:" + projectId;
  var conv = ensureConversation(key);
  conv.projectId = projectId;
  state.activeConversationKey = key;
  if (conv.initialized){
    renderConversation();
    return;
  }
  // 有历史则回放，无历史则引导
  try {
    var data = await api("/api/projects/" + encodeURIComponent(projectId) + "/messages?student_id=" + encodeURIComponent(STUDENT_ID));
    var msgs = data && Array.isArray(data.messages) ? data.messages : [];
    conv.initialized = true;
    renderConversation();
    if (msgs.length === 0){
      var p = projectById(projectId);
      addMsg("ai", "<p>欢迎进入「<strong>" + escapeHtml(p ? (p.goal_name || "") : "") + "</strong>」学习项目。你想从哪里开始？可以直接问，也可以打开项目总览里的学习路径。</p>");
    } else {
      msgs.forEach(function(m){
        addMsg(m.role === "user" ? "user" : "ai", "<p>" + renderMarkdown(m.content || m.message || "") + "</p>");
      });
      renderConversation();
    }
  } catch (err){
    conv.initialized = true;
    renderConversation();
    addMsg("ai", "<p>欢迎进入该项目。想从哪里开始？</p>");
  }
}

/* ================= 对话发送（/api/agent/turn） ================= */
function sendChat(){
  var input = $("chatInput");
  var msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  if (state.taskConversionMode) requestTaskConversion(msg);
  else requestAgentTurn(msg);
}
function toggleTaskConversionMode(){
  state.taskConversionMode = !state.taskConversionMode;
  var button = $("taskConversionEntry");
  button.classList.toggle("active", state.taskConversionMode);
  button.setAttribute("aria-pressed", state.taskConversionMode ? "true" : "false");
  button.querySelector(".tool-label").textContent = state.taskConversionMode
    ? "任务步骤模式"
    : "生成任务步骤";
  if (state.taskConversionMode){
    setChatContext("任务步骤生成", "输入一个真实工作任务");
    setSuggestions([
      "Windows 11 系统重装与驱动验收",
      "配置交换机 VLAN 与 Trunk 并验收连通性",
      "新能源汽车电池包安装与安全检查"
    ]);
    focusChat("描述要转化的真实工作任务…");
  } else {
    var project = projectById(state.currentProjectId);
    setChatContext(
      project ? (project.goal_name || "学习助手") : "学习助手",
      project ? (project.direction || "") : "说出你的学习目标"
    );
    setSuggestions([]);
    focusChat("输入消息…");
  }
}
async function requestTaskConversion(message){
  var key = state.activeConversationKey || "draft";
  var conv = ensureConversation(key);
  if (conv.busy) return;
  conv.busy = true;
  $("chatSend").disabled = true;
  addMsg("user", escapeHtml(message));
  var typing = appendTyping();
  try {
    var result = await api("/api/integrations/learning-task-conversion/generate", {
      method: "POST",
      body: { query: message, student_id: STUDENT_ID },
      timeoutMs: 280000
    });
    removeTyping(typing);
    if (result.status === "needs_clarification"){
      addMsg("ai", "<p>" + renderMarkdown(result.message || "请补充具体的任务对象、动作或交付结果。") + "</p>");
      return;
    }
    if (!result.bundle || !result.bundle.task){
      throw new Error(result.message || "没有收到可展示的任务步骤");
    }
    openTaskConversionTab(result);
    addMsg("ai", "<p>具体任务步骤已经生成，并在中间工作区打开。</p>");
    setSuggestions([]);
  } catch(err){
    removeTyping(typing);
    addMsg("ai", '<p style="color:var(--bad)">' + escapeHtml(err.message) + "</p>");
  } finally {
    conv.busy = false;
    $("chatSend").disabled = false;
  }
}
async function requestAgentTurn(message){
  var key = state.activeConversationKey || "draft";
  var conv = ensureConversation(key);
  if (conv.busy) return;
  conv.busy = true;
  $("chatSend").disabled = true;
  addMsg("user", escapeHtml(message));
  var typing = appendTyping();
  var isDraft = key === "draft";
  var payload = {
    student_id: STUDENT_ID,
    message: message,
    session_id: isDraft ? "draft" : ("project-" + (state.currentProjectId || "none")),
    use_knowledge_base: true,
    allow_web_search: true
  };
  if (!isDraft && state.currentProjectId) payload.project_id = state.currentProjectId;
  try {
    var data = await api("/api/agent/turn", { method: "POST", body: payload, timeoutMs: 60000 });
    removeTyping(typing);
    await handleAgentTurn(data, message);
  } catch(err){
    removeTyping(typing);
    addMsg("ai", '<p style="color:var(--bad)">' + escapeHtml(err.message) + '</p>');
  } finally {
    conv.busy = false;
    $("chatSend").disabled = false;
  }
}
function appendTyping(){
  var wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.innerHTML = '<div class="who">知行课径</div><div class="bubble"><span class="typing-dots"><i></i><i></i><i></i></span></div>';
  $("chatMessages").appendChild(wrap);
  scrollChat();
  return wrap;
}
function removeTyping(id){
  if (id && id.parentNode) id.parentNode.removeChild(id);
}
async function handleAgentTurn(data, userMsg){
  if (data.status === "needs_clarification"){
    var html = "<p>" + renderMarkdown(data.message || data.text || "") + "</p>";
    var opts = data.clarify_options || [];
    if (opts.length){
      html += '<div style="margin-top:10px">';
      opts.forEach(function(o, i){
        var label = o.label || o.prompt || "";
        var prompt = o.prompt || o.label || "";
        html += '<button class="choice-opt" data-clarify data-prompt="' + escapeAttr(prompt) + '"><span class="co-k">' + (i + 1) + '</span>' + escapeHtml(label) + '</button>';
      });
      html += '</div>';
    }
    addMsg("ai", html);
    setSuggestions(opts.map(function(o){ return o.label || o.prompt; }).filter(Boolean));
    return;
  }
  var intent = data.intent || "";
  if (intent === "create_project" && data.action === "project_created"){
    addMsg("ai", "<p>" + renderMarkdown(data.message || "") + "</p>");
    await onProjectCreated(data.project, userMsg, data.message);
    return;
  }
  if (intent === "open_lesson" && data.action === "open_lesson"){
    addMsg("ai", "<p>" + renderMarkdown(data.message || "") + "</p>");
    var art = data.artifact || {};
    var lessonData = art.type === "lesson" ? art.data : null;
    if (lessonData && lessonData.status === "preparing") lessonData = null;
    openLessonTab(data.project_id || state.currentProjectId, data.knowledge_point_id, data.knowledge_point_name || "讲解", lessonData);
    setSuggestions([]);
    return;
  }
  if (intent === "show_path" && data.action === "show_path"){
    addMsg("ai", "<p>" + renderMarkdown(data.message || "") + "</p>");
    if (state.currentProjectId) openTab("plan", "学习计划", "🗓", { projectId: state.currentProjectId });
    setSuggestions([]);
    return;
  }
  if (intent === "start_assessment" && data.action === "show_assessment"){
    addMsg("ai", "<p>" + renderMarkdown(data.message || "") + "</p>");
    var aa = data.artifact && data.artifact.type === "assessment" ? data.artifact.data : null;
    if (aa && state.currentProjectId){
      openQuizTab(state.currentProjectId, aa.assessment_type, null, aa);
    }
    setSuggestions([]);
    return;
  }
  if (intent === "show_capability_catalog"){
    addMsg("ai", "<p>" + renderMarkdown(data.message || "") + "</p>");
    setSuggestions([]);
    return;
  }
  /* 兜底：knowledge_question / general_assistant → reply */
  var answer = data.message || (data.artifact && data.artifact.data && data.artifact.data.answer) || "（无回复）";
  var chatData = data.artifact && data.artifact.type === "answer" ? data.artifact.data : null;
  var src = chatData && chatData.sources;
  var out = "<p>" + renderMarkdown(answer) + "</p>";
  if (src && src.length){
    out += '<div class="md-src">' + src.slice(0, 4).map(function(s){ return "· " + escapeHtml(s.title || s.locator || ""); }).join("<br/>") + '</div>';
  }
  addMsg("ai", out);
  setSuggestions([]);
}
async function onProjectCreated(proj, userMsg, aiMsg){
  var pid = proj && (proj.project_id || proj.id);
  if (!pid) return;
  state.draftingProject = false;
  var exists = state.projects.find(function(p){ return (p.project_id || p.id) === pid; });
  if (exists) Object.assign(exists, proj);
  else state.projects.unshift(proj);
  renderProjectList();
  state.currentProjectId = pid;
  var conv = ensureConversation("project:" + pid);
  conv.projectId = pid;
  conv.initialized = true;
  conv.messages = [];
  if (userMsg) conv.messages.push({ role: "user", html: escapeHtml(userMsg) });
  if (aiMsg) conv.messages.push({ role: "ai", html: "<p>" + renderMarkdown(aiMsg) + "</p>" });
  switchProject(pid);
  state.activeConversationKey = "project:" + pid;
  renderConversation();
  setSuggestions([]);
  refreshProjects();
}
async function refreshProjects(){
  try {
    var data = await api("/api/projects?student_id=" + encodeURIComponent(STUDENT_ID));
    if (data && Array.isArray(data.projects)) state.projects = data.projects;
    renderProjectList();
  } catch(e){}
}
function enterDraftMode(){
  if (state.draftingProject){ focusChat("说出你想学什么…"); return; }
  state.draftingProject = true;
  state.activeConversationKey = "draft";
  var conv = ensureConversation("draft");
  setChatContext("新建学习项目", "对话澄清目标后生成项目");

    addMsg("ai", "<p>想学点新东西？直接说出目标，比如「我想学 Python 数据分析」。我会先追问几个问题澄清，然后帮你建一个独立的学习项目。</p>");
    setSuggestions(["我想学 Python 数据分析", "我想学 Java 应用开发", "我想掌握前端工程化"]);

/* ================= 工作台标签系统（VSCode 式多页） ================= */
function workspaceTab(tabId){
  return state.tabs.find(function(t){ return t.id === tabId; }) || null;
}
function renderTabbar(){
  var bar = $("tabbar");
  bar.innerHTML = state.tabs.map(function(t){
    return '<div class="tab' + (t.id === state.activeTabId ? " active" : "") + '" data-tab-id="' + escapeAttr(t.id) + '" role="tab" title="' + escapeAttr(t.label) + '">' +
      (t.icon ? '<span class="t-ic">' + t.icon + '</span>' : "") +
      '<span class="t-name">' + escapeHtml(t.label) + '</span>' +
      '<span class="t-x" data-tab-close="' + escapeAttr(t.id) + '">×</span></div>';
  }).join("");
  bar.querySelectorAll(".tab").forEach(function(el){
    el.addEventListener("click", function(){ activateTab(el.dataset.tabId); });
  });
  bar.querySelectorAll("[data-tab-close]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      closeTab(el.dataset.tabClose);
    });
  });
}
function pageEl(tabId){
  var el = document.getElementById("page-" + tabId);
  if (!el){
    el = document.createElement("div");
    el.className = "page";
    el.id = "page-" + tabId;
    $("pageArea").appendChild(el);
  }
  return el;
}
function activateTab(tabId){
  if (state.tabs.length === 0){ state.activeTabId = null; showWelcome(); renderTabbar(); return; }
  var tab = workspaceTab(tabId);
  if (!tab){ tab = state.tabs[state.tabs.length - 1]; tabId = tab.id; }
  if (state.activeTabId && state.activeTabId !== tabId){
    var prev = workspaceTab(state.activeTabId);
    if (prev){ var pel = document.getElementById("page-" + prev.id); if (pel) prev.scrollTop = pel.scrollTop; }
  }
  state.activeTabId = tabId;
  // 新标签首次激活时先创建页面节点，避免后续 active 切换漏掉新页面。
  pageEl(tabId);
  document.getElementById("page-welcome").classList.remove("active");
  state.tabs.forEach(function(t){
    var el = document.getElementById("page-" + t.id);
    if (el) el.classList.toggle("active", t.id === tabId);
  });
  renderTabbar();
  renderPage(tab);
}
function renderPage(tab){
  var el = pageEl(tab.id);
  if (tab.view === "welcome"){ return; }
  if (tab.view === "task-conversion"){ renderTaskConversionPage(el, tab); return; }
  if (tab.view === "overview"){ renderOverviewPage(el, tab); return; }
  if (tab.view === "lesson"){ renderLessonPage(el, tab); return; }
  if (tab.view === "map"){ renderMapPage(el, tab); return; }
  if (tab.view === "quiz"){ renderQuizPage(el, tab); return; }
  if (tab.view === "assessment"){ renderAssessmentPage(el, tab); return; }
  if (tab.view === "wrongbook"){ renderWrongbookPage(el, tab); return; }
  if (tab.view === "plan"){ renderPlanPage(el, tab); return; }
  el.innerHTML = '<div class="empty-state"><div class="es-ic">🚧</div>该页面尚未实现</div>';
}
function taskText(value){
  if (value == null) return "";
  if (Array.isArray(value)) return value.map(taskText).filter(Boolean).join("；");
  if (typeof value === "object"){
    return taskText(value.description || value.name || value.content || value.value || "");
  }
  return String(value).trim();
}
function openTaskConversionTab(result){
  var bundle = result.bundle || {};
  var workTask = (bundle.task && bundle.task.work_task) || {};
  var title = taskText(workTask.teaching_task_name || workTask.enterprise_task_name) || "具体任务步骤";
  var tabId = "task-conversion:" + (result.task_card_id || bundle.task_card_id || Date.now());
  var tab = workspaceTab(tabId);
  if (!tab){
    tab = openTab("task-conversion", title, "✦", { tabId: tabId });
  } else {
    tab.label = title;
    activateTab(tab.id);
  }
  tab.result = result;
  tab.error = null;
  renderTabbar();
  renderPage(tab);
}
function renderTaskConversionPage(el, tab){
  var result = tab.result || {};
  var bundle = result.bundle || {};
  var workTask = (bundle.task && bundle.task.work_task) || {};
  var taskCardId = result.task_card_id || bundle.task_card_id || "";
  var steps = Array.isArray(workTask.task_steps) ? workTask.task_steps : [];
  if (!steps.length){
    el.innerHTML = emptyState("⚠️", "本次结果没有可展示的任务步骤");
    return;
  }
  var knowledge = {};
  (workTask.knowledge_points || []).forEach(function(item){
    var id = item.knowledge_id || item.knowledge_point_id || item.id;
    if (id) knowledge[id] = item;
  });
  var skills = {};
  (workTask.skill_points || []).forEach(function(item){
    var id = item.skill_id || item.skill_point_id || item.id;
    if (id) skills[id] = taskText(item.name || item.skill_point_name || id);
  });
  var title = taskText(workTask.teaching_task_name || workTask.enterprise_task_name) || "具体任务步骤";
  var description = taskText(
    workTask.teaching_task_description || workTask.enterprise_task_description || workTask.work_situation
  );
  var situation = taskText(workTask.task_scenario || workTask.work_situation);
  var tools = taskText(workTask.tools);
  var safetySummary = taskText(workTask.safety_points);
  var acceptanceSummary = taskText(workTask.acceptance_tests);
  var html = '<div class="task-document"><header class="task-document-head">' +
    '<div class="task-document-mark">✦</div><div><h1>' + escapeHtml(title) + '</h1>' +
    (description ? '<p>' + escapeHtml(description) + '</p>' : '') + '</div></header>';
  if (situation || tools || safetySummary || acceptanceSummary){
    html += '<div class="task-context-grid">' +
      (situation ? '<div class="task-context-card"><b>工作情境</b><p>' + escapeHtml(situation) + '</p></div>' : '') +
      (tools ? '<div class="task-context-card"><b>工具与材料</b><p>' + escapeHtml(tools) + '</p></div>' : '') +
      ((safetySummary || acceptanceSummary) ? '<div class="task-context-card"><b>安全与总体验收</b><p>' +
        escapeHtml([safetySummary, acceptanceSummary].filter(Boolean).join("；")) + '</p></div>' : '') +
      '</div>';
  }
  html += '<div class="task-step-list">';
  steps.forEach(function(step, index){
    var number = step.step || step.order || index + 1;
    var name = taskText(step.name || step.title || step.action) || ("任务步骤 " + number);
    var action = taskText(step.action || step.description || step.operation_guidance || step.instruction);
    var instruction = taskText(step.instruction);
    var prerequisites = taskText(step.prerequisites || step.precondition || step.prerequisite);
    var deliverable = taskText(step.deliverable || step.output || step.stage_deliverable);
    var acceptance = taskText(step.check || step.acceptance || step.acceptance_criteria || step.checkpoint);
    var safety = taskText(step.safety || step.safety_boundary || step.safety_boundaries);
    var kpIds = step.knowledge_point_ids || step.knowledge_ids || [];
    var skillIds = step.skill_point_ids || step.skill_ids || [];
    var kpItems = kpIds.map(function(id){
      return knowledge[id] || { knowledge_id:id, name:id, learning_resources:[] };
    }).filter(Boolean);
    var skillNames = skillIds.map(function(id){ return skills[id] || id; }).filter(Boolean);
    html += '<article class="task-step-card"><div class="task-step-no">' +
      String(number).padStart(2, "0") + '</div><div class="task-step-main"><h2>' + escapeHtml(name) + '</h2>' +
      (action ? '<div class="task-step-action">' + escapeHtml(action) + '</div>' : '');
    if (prerequisites || deliverable || acceptance || safety || (instruction && instruction !== action)){
      html += '<div class="task-step-grid">' +
        (prerequisites ? '<div class="task-step-field"><b>开始前</b><span>' + escapeHtml(prerequisites) + '</span></div>' : '') +
        ((instruction && instruction !== action) ? '<div class="task-step-field"><b>操作说明</b><span>' + escapeHtml(instruction) + '</span></div>' : '') +
        (deliverable ? '<div class="task-step-field"><b>步骤产物</b><span>' + escapeHtml(deliverable) + '</span></div>' : '') +
        (acceptance ? '<div class="task-step-field"><b>验收依据</b><span>' + escapeHtml(acceptance) + '</span></div>' : '') +
        (safety ? '<div class="task-step-field"><b>安全边界</b><span>' + escapeHtml(safety) + '</span></div>' : '') +
        '</div>';
    }
    if (kpItems.length || skillNames.length){
      html += '<div class="task-step-learning">';
      if (kpItems.length){
        html += '<strong>本步骤知识点与学习资源</strong>';
        kpItems.forEach(function(item){
          var knowledgeId = item.knowledge_id || item.knowledge_point_id || item.id || "";
          var knowledgeName = taskText(item.name || item.knowledge_point_name || knowledgeId);
          var resources = Array.isArray(item.learning_resources) ? item.learning_resources : [];
          html += '<div class="task-knowledge-card"><div class="task-knowledge-top"><div class="task-knowledge-body">' +
            '<div class="task-knowledge-name">' + escapeHtml(knowledgeName) + '</div>' +
            (item.scope ? '<div class="task-knowledge-scope">' + escapeHtml(taskText(item.scope)) + '</div>' : '') +
            '</div>' +
            (taskCardId && knowledgeId ? '<button class="task-personalize" data-personalize data-task-card="' +
              escapeAttr(taskCardId) + '" data-knowledge="' + escapeAttr(knowledgeId) + '" data-name="' +
              escapeAttr(knowledgeName) + '">进入个性化学习</button>' : '') + '</div>';
          if (resources.length){
            html += '<div class="task-resources">' + resources.map(function(resource){
              var url = safeHttpUrl(resource.resource_url || resource.url || "");
              if (!url) return "";
              var platform = String(resource.platform || "").toLowerCase();
              var icon = platform === "bilibili" ? "▶" : (platform === "douyin" ? "♪" : "↗");
              return '<a class="task-resource" href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' +
                icon + ' ' + escapeHtml(taskText(resource.resource_name || resource.title || "学习资源")) + '</a>';
            }).join("") + '</div>';
          }
          html += '</div>';
        });
      }
      if (skillNames.length){
        html += '<div style="margin-top:5px"><strong>本步骤技能点</strong>' + skillNames.map(function(name){
          return '<span class="task-chip">' + escapeHtml(name) + '</span>';
        }).join("") + '</div>';
      }
      html += '</div>';
    }
    html += '</div></article>';
  });
  html += '</div></div>';
  el.innerHTML = html;
  el.onclick = function(event){
    var button = event.target.closest("[data-personalize]");
    if (button) launchTaskPersonalizedLearning(button);
  };
}
async function launchTaskPersonalizedLearning(button){

    modeButton.setAttribute("aria-pressed", "false");
    modeButton.querySelector(".tool-label").textContent = "生成任务步骤";

function openTab(view, label, icon, data){
  data = data || {};
  var base = view + ":" + (data.projectId || "");
  var id = data.tabId || (view === "lesson" ? "lesson:" + data.projectId + ":" + data.knowledgePointId : base + ":" + (data.knowledgePointId || ""));
  if (view !== "lesson") id = id.replace(/:$/, "");
  var existing = workspaceTab(id);
  if (existing){ activateTab(id); return existing; }
  var tab = {
    id: id, view: view, label: label, icon: icon,
    projectId: data.projectId, knowledgePointId: data.knowledgePointId,
    knowledgePointName: data.knowledgePointName, stepId: data.stepId,
    data: data, scrollTop: 0, result: null, busy: false, error: null
  };
  state.tabs.push(tab);
  activateTab(id);
  return tab;
}
function closeTab(tabId){
  var idx = state.tabs.findIndex(function(t){ return t.id === tabId; });
  if (idx < 0) return;
  var t = state.tabs[idx];
  if (t.view === "lesson") stopLessonReplay(t);
  state.tabs.splice(idx, 1);
  var el = document.getElementById("page-" + tabId);
  if (el) el.remove();
  if (state.activeTabId === tabId){
    var next = state.tabs[idx] || state.tabs[idx - 1] || null;
    if (next) activateTab(next.id);
    else { state.activeTabId = null; showWelcome(); renderTabbar(); }
  } else {
    renderTabbar();
  }
}
function showWelcome(){
  document.getElementById("page-welcome").classList.add("active");
  state.tabs.forEach(function(t){
    var el = document.getElementById("page-" + t.id);
    if (el) el.classList.remove("active");
  });
  state.activeTabId = null;
}
function switchProject(projectId){
  // 全栏跟随：清空当前工作台，打开新项目的总览页
  [].concat(state.tabs).forEach(function(t){ closeTab(t.id); });
  openTab("overview", "项目总览", "◈", { projectId: projectId });
  var p = projectById(projectId);
  setChatContext(p ? p.goal_name : "学习助手", p ? (p.direction || "") : "说出你的学习目标");
}
</script>
</body>
