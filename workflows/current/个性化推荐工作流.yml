            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 2a903e54-78d3-5940-8d1d-999e969820c3
            name: context_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: 61ef823a-afc5-5246-b0e9-f3397380ad9e
            name: strategy_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: eb3574e7-ba1b-531d-bcbc-6fe357ccf98f
            name: student_profile_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: 134e2161-598f-57d2-b584-4b7943396441
            name: kb_text
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json


            def main(raw_input):
                data = json.loads(str(raw_input or "{}"), strict=False)
                if not isinstance(data, dict):
                    raise ValueError("输入必须是 JSON 对象")
                student_profile = data.get("student_profile", {})
                if not isinstance(student_profile, dict):
                    student_profile = {}
                knowledge_state = data.get("knowledge_state", {})
                if not isinstance(knowledge_state, dict):
                    knowledge_state = {}
                recent_events = data.get("recent_events", [])
                if not isinstance(recent_events, list):
                    recent_events = []
                learning_goal = data.get("learning_goal", {})
                if not isinstance(learning_goal, dict):
                    learning_goal = {}
                items = knowledge_state.get("items", [])
                if not isinstance(items, list):
                    items = []
                candidates = []
                for item in items:
                    if not isinstance(item, dict):
                        continue
                    item_id = str(item.get("knowledge_point_id", "")).strip()
                    mastery = int(item.get("mastery", 0) or 0)
                    wrong_streak = int(item.get("wrong_streak", 0) or 0)
                    last_reviewed = str(item.get("last_reviewed_at", "") or "")
                    if mastery < 60:
                        candidates.append({
                            "type": "remediate",
                            "knowledge_point_id": item_id,
                            "title": str(item.get("knowledge_point_name", item_id)),
                            "priority_hint": 1,
                            "evidence": "掌握度仅 " + str(mastery) + "%",
                        })
                    elif wrong_streak >= 2:
                        candidates.append({
                            "type": "practice",
                            "knowledge_point_id": item_id,
                            "title": str(item.get("knowledge_point_name", item_id)),
                            "priority_hint": 2,
                            "evidence": "连续 " + str(wrong_streak) + " 次同类错误",
                        })
                    elif mastery >= 80 and last_reviewed:
                        candidates.append({
                            "type": "review",
                            "knowledge_point_id": item_id,
                            "title": str(item.get("knowledge_point_name", item_id)),
                            "priority_hint": 3,
                            "evidence": "上次复习较早，建议巩固",
                        })
                recent_missed = set()
                for event in recent_events:
                    if isinstance(event, dict) and str(event.get("effect", "")).lower() == "not_understood":
                        kid = str(event.get("knowledge_point_id", "")).strip()
                        if kid:
                            recent_missed.add(kid)
                for kid in sorted(recent_missed):
                    if not any(c["knowledge_point_id"] == kid for c in candidates):
                        candidates.append({
                            "type": "practice",
                            "knowledge_point_id": kid,
                            "title": kid,
                            "priority_hint": 4,
                            "evidence": "近期出现未理解反馈",
                        })
                context = {
                    "student_profile": student_profile,
                    "knowledge_state": knowledge_state,
                    "recent_events": recent_events,
                    "learning_goal": learning_goal,
                    "rule_candidates": candidates[:8],
                }
                return {
                    "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
                    "strategy_json": json.dumps({"source": "rule_candidates", "count": len(candidates[:8])}, ensure_ascii=False, separators=(",", ":")),
                    "student_profile_json": json.dumps(student_profile, ensure_ascii=False, separators=(",", ":")),
                    "kb_text": "规则候选：" + json.dumps(candidates[:8], ensure_ascii=False),
                }
          appId: 12a0a7e2
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
        labelEdit: false
        icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
        description: 面向开发者提供 Python 代码执行能力。
