    - id: ifly-code::5c01073f-bf1d-5df4-a143-ea1962450943
      type: 代码
      position: {x: 1260, y: 200}
      positionAbsolute: {x: 1260, y: 200}
      width: 362
      height: 100
      data:
        allowInputReference: true
        allowOutputReference: true
        label: 校验推荐输出
        nodeMeta: {aliasName: 代码, nodeType: 工具}
        inputs:
          - id: 388fdc31-936f-5e14-a71d-872ed849f489
            name: model_output
            schema:
              type: string
              value:
                type: ref
                content: {name: output, id: 3060f65e-d85e-50ca-8607-43506d24e90e, nodeId: 'spark-llm::aa1b15da-20b1-58a0-ab49-5855ba019056'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 00cf0bfc-f19b-5f7a-9a86-01169808eca4
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re


            VALID_TYPES = {"remediate", "advance", "practice", "review"}


            def main(model_output):
                try:
                    text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                    start, end = text.find("{"), text.rfind("}")
                    if start < 0 or end < start:
                        raise ValueError("大模型输出中未找到 JSON 对象")
                    result = json.loads(text[start:end + 1], strict=False)
                    items = result.get("recommendations")
                    if not isinstance(items, list):
                        raise ValueError("recommendations 必须是数组")
                    if not (3 <= len(items) <= 5):
                        raise ValueError("推荐数量必须在 3-5 之间")
                    ids = []
                    for item in items:
                        if not isinstance(item, dict):
                            raise ValueError("推荐项必须是对象")
                        item_id = str(item.get("knowledge_point_id", "")).strip()
                        if not item_id:
                            raise ValueError("推荐项缺少 knowledge_point_id")
                        ids.append(item_id)
                        if item.get("type") not in VALID_TYPES:
                            raise ValueError("推荐类型不在允许枚举中")
                        if not str(item.get("reason", "")).strip():
                            raise ValueError("推荐项缺少 reason")
                    if len(set(ids)) != len(ids):
                        raise ValueError("推荐项不能重复")
                    result["status"] = "ok"
                    return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
                except Exception:
                    fallback = {
                        "status": "system_retryable",
                        "recommendations": [],
                        "error_message": "推荐校验未通过，正在重新生成",
                    }
                    return {"final_result_json": json.dumps(fallback, ensure_ascii=False, separators=(",", ":"))}
          appId: 12a0a7e2
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
        labelEdit: false
        icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
        description: 面向开发者提供 Python 代码执行能力。
      dragging: false
