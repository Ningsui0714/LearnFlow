      - id: a676ef71-83eb-4f7e-8ac8-b406f628f3ca
        name: web_search_context_json
        nameErrMsg: ''
        schema:
          type: string
          default: ''
        required: false
      nodeParam:
        uid: '21880654528'
        code: |-
          import base64
          import json
          import re
          import zlib


          ROUTE_TYPES = {
              "first_learning",
              "resume_learning",
              "error_remediation",
              "retry_original",
              "variant_practice",
              "history_review",
          }

          USER_CLARIFIABLE_FIELDS = {
              "question_snapshot.question_text": "请补充本次题目或实训任务的完整描述。若确实无法提供，请回复“无法提供”。",
              "current_attempt.student_answer": "请补充你当时提交的答案、代码、操作步骤或故障现象。若确实无法提供，请回复“无法提供”。",
          }

          STOP_REPLIES = {
              "不知道", "不清楚", "没有", "没法提供", "无法提供", "不能提供",
              "结束", "停止", "取消", "算了", "退出",
          }


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _load_json(value):
              if isinstance(value, dict):
                  return value
              text = str(value or "").strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError("未找到 JSON 对象")
              return json.loads(text[start:end + 1])


          def _object_field(data, name, default=None):
              if default is None:
                  default = {}
              value = data.get(name, data.get(name + "_json", default))
              if value is None or value == "":
                  return default
              if isinstance(value, str):
                  value = _load_json(value)
              if not isinstance(value, dict):
                  raise ValueError(name + " 必须是 Object")
              return value


          def _web_search_context(data):
              value = data.get("web_search_context", data.get("web_search_results", {}))
              if value is None or value == "":
                  return {}
              if isinstance(value, str):
                  try:
                      value = _load_json(value)
                  except Exception:
                      return {"text": value.strip()}
              if isinstance(value, (dict, list)):
                  return value
              return {"text": str(value)}


          def _set_path(data, path, value):
              current = data
              parts = path.split(".")
              for key in parts[:-1]:
                  child = current.get(key)
                  if not isinstance(child, dict):
                      child = {}
                      current[key] = child
                  current = child
              current[parts[-1]] = value


          def _encode_resume(data, pending_field):
              payload = {
                  "version": 1,
                  "pending_field": pending_field,
                  "data": data,
              }
              raw = _json_text(payload).encode("utf-8")
              packed = zlib.compress(raw, 9)
              return base64.urlsafe_b64encode(packed).decode("ascii").rstrip("=")


          def _decode_resume(token):
              text = str(token or "").strip()
              if not text:
                  raise ValueError("resume_token 不能为空")
              text += "=" * (-len(text) % 4)
              packed = base64.urlsafe_b64decode(text.encode("ascii"))
              payload = json.loads(zlib.decompress(packed).decode("utf-8"))
              if not isinstance(payload, dict) or not isinstance(payload.get("data"), dict):
                  raise ValueError("resume_token 内容无效")
              return payload


          def _is_stop_reply(reply):
              normalized = re.sub(r"[\s，。！？,.!?]", "", str(reply or "")).lower()
              return normalized in STOP_REPLIES or any(word in normalized for word in ("无法提供", "不能提供", "结束本次"))


          def _base_result():
              return {
                  "is_valid": False,
                  "error_message": "",
                  "normalized_context_json": "{}",
                  "route_type": "",
                  "evaluation_status": "",
                  "knowledge_context_json": "{}",
                  "student_id": "",
                  "session_id": "",
                  "attempt_id": "",
                  "recovery_status": "fatal_internal",
                  "error_class": "fatal_internal",
                  "error_code": "UNEXPECTED_INPUT_ERROR",
                  "missing_fields_json": "[]",
                  "clarification_question": "",
                  "resume_token": "",
                  "user_message": "系统暂时无法继续本次讲解，请稍后重试。",
                  "recovery_result_json": "{}",
                  "web_search_context_json": "{}",
              }


          def _recovery_result(status, error_class, error_code, message, user_message,
                               data=None, missing_fields=None, question="", resume_token=""):
              result = _base_result()
              result.update({
                  "recovery_status": status,
                  "error_class": error_class,
                  "error_code": error_code,
                  "error_message": str(message),
                  "missing_fields_json": _json_text(missing_fields or []),
                  "clarification_question": question,
                  "resume_token": resume_token,
                  "user_message": user_message,
              })
              if isinstance(data, dict):
                  result["student_id"] = str(data.get("student_id", ""))
                  result["session_id"] = str(data.get("session_id", ""))
                  result["attempt_id"] = str(data.get("attempt_id", ""))
                  result["route_type"] = str(data.get("route_type", ""))
                  result["web_search_context_json"] = _json_text(_web_search_context(data))
              payload = {
                  "schema_version": "2.0",
                  "status": status,
                  "error_class": error_class,
                  "error_code": error_code,
                  "message": user_message,
                  "technical_message": str(message),
                  "clarification": {
                      "required": status == "needs_clarification",
                      "question": question,
                      "missing_fields": missing_fields or [],
                      "resume_token": resume_token,
                  },
              }
              result["recovery_result_json"] = _json_text(payload)
              return result


          def _clarification_result(data, missing_fields):
              field = missing_fields[0]
              question = USER_CLARIFIABLE_FIELDS[field]
              token = _encode_resume(data, field)
              return _recovery_result(
                  "needs_clarification",
                  "user_clarifiable",
                  "MISSING_USER_INFORMATION",
                  "缺少用户可补充字段: " + field,
                  question,
                  data=data,
                  missing_fields=missing_fields,
                  question=question,
                  resume_token=token,
              )


          def main(raw_input):
              try:
                  data = _load_json(raw_input)

                  if str(data.get("resume_token", "")).strip():
                      payload = _decode_resume(data.get("resume_token"))
                      reply = data.get("clarification_reply", data.get("user_reply", ""))
                      pending_field = str(payload.get("pending_field", ""))
                      base_data = payload["data"]
                      if _is_stop_reply(reply):
                          return _recovery_result(
                              "ended_by_user",
                              "user_clarifiable",
                              "USER_CANNOT_PROVIDE_INFORMATION",
                              "用户无法提供字段: " + pending_field,
                              "已结束本次讲解。你可以在资料完整后重新发起。",
                              data=base_data,
                              missing_fields=[pending_field] if pending_field else [],
                          )
                      if not str(reply or "").strip():
                          return _clarification_result(base_data, [pending_field])
                      if pending_field not in USER_CLARIFIABLE_FIELDS:
                          raise ValueError("resume_token 中的 pending_field 不可由用户补充")
                      _set_path(base_data, pending_field, str(reply).strip())
                      data = base_data

                  for key in ("student_id", "session_id", "attempt_id", "route_type"):
                      if not str(data.get(key, "")).strip():
                          return _recovery_result(
                              "fatal_internal",
                              "fatal_internal",
                              "MISSING_SYSTEM_FIELD",
                              "缺少系统必需字段: " + key,
                              "系统数据不完整，暂时无法继续本次讲解。",
                              data=data,
                              missing_fields=[key],
                          )

                  route_type = str(data["route_type"]).strip()
                  if route_type not in ROUTE_TYPES:
                      return _recovery_result(
                          "fatal_internal", "fatal_internal", "INVALID_ROUTE_TYPE",
                          "route_type 不在允许枚举中",
                          "系统路由配置有误，暂时无法继续本次讲解。",
                          data=data,
                      )

                  student_profile = _object_field(data, "student_profile")
                  question = _object_field(data, "question_snapshot")
                  attempt = _object_field(data, "current_attempt")
                  evaluation = _object_field(data, "validated_evaluation")
                  state = _object_field(data, "knowledge_state")
                  history = _object_field(data, "history_memory")
                  resume = _object_field(data, "resume_state")
                  knowledge_context = _object_field(data, "knowledge_context")
                  web_search_context = _web_search_context(data)

                  if not str(question.get("question_id", "")).strip():
                      return _recovery_result(
                          "fatal_internal", "fatal_internal", "MISSING_QUESTION_ID",
                          "question_snapshot.question_id 不能为空",
                          "系统没有提供题目标识，暂时无法继续本次讲解。",
                          data=data,
                          missing_fields=["question_snapshot.question_id"],
                      )
                  if evaluation.get("validation_passed") is not True:
                      return _recovery_result(
                          "fatal_internal", "fatal_internal", "EVALUATION_NOT_VALIDATED",
                          "validated_evaluation 尚未通过上游 JSON 校验",
                          "系统评分结果尚未通过校验，暂时不会生成讲解。",
                          data=data,
                          missing_fields=["validated_evaluation.validation_passed"],
                      )

                  missing_user_fields = []
                  if not str(question.get("question_text", "")).strip():
                      missing_user_fields.append("question_snapshot.question_text")
                  if not str(attempt.get("student_answer", "")).strip():
                      missing_user_fields.append("current_attempt.student_answer")
                  if missing_user_fields:
                      return _clarification_result(data, missing_user_fields)

                  error_points = evaluation.get("error_points", [])
                  if not isinstance(error_points, list):
                      return _recovery_result(
                          "fatal_internal", "fatal_internal", "INVALID_ERROR_POINTS",
                          "validated_evaluation.error_points 必须是 Array",
                          "系统错误诊断结果格式不正确，暂时无法继续本次讲解。",
                          data=data,
                      )

                  evaluation_status = str(evaluation.get("evaluation_status", "")).lower().strip()
                  if evaluation_status not in {"correct", "partial", "incorrect"}:
                      if evaluation.get("is_correct") is True:
                          evaluation_status = "correct"
                      else:
                          score = float(evaluation.get("score", 0) or 0)
                          max_score = float(evaluation.get("max_score", 100) or 100)
                          ratio = score / max_score if max_score > 0 else 0
                          evaluation_status = "partial" if ratio > 0 else "incorrect"

                  if evaluation_status != "correct" and not error_points:
                      return _recovery_result(
                          "fatal_internal", "fatal_internal", "MISSING_ERROR_POINTS",
                          "非正确评价必须提供至少一个 error_points 元素",
                          "系统尚未给出可核验的错误点，暂时不会猜测你的问题。",
                          data=data,
                          missing_fields=["validated_evaluation.error_points"],
                      )

                  normalized = {
                      "schema_version": str(data.get("schema_version", "1.0")),
                      "student_id": str(data["student_id"]),
                      "session_id": str(data["session_id"]),
                      "attempt_id": str(data["attempt_id"]),
                      "route_type": route_type,
                      "student_profile": student_profile,
                      "question_snapshot": question,
                      "current_attempt": attempt,
                      "validated_evaluation": evaluation,
                      "evaluation_status": evaluation_status,
                      "knowledge_state": state,
                      "history_memory": history,
                      "resume_state": resume,
                      "knowledge_context": knowledge_context,
                      "web_search_context": web_search_context,
                  }

                  return {
                      "is_valid": True,
                      "error_message": "",
                      "normalized_context_json": _json_text(normalized),
                      "route_type": route_type,
                      "evaluation_status": evaluation_status,
                      "knowledge_context_json": _json_text(knowledge_context),
                      "student_id": str(data["student_id"]),
                      "session_id": str(data["session_id"]),
                      "attempt_id": str(data["attempt_id"]),
                      "recovery_status": "ready",
                      "error_class": "",
                      "error_code": "",
                      "missing_fields_json": "[]",
                      "clarification_question": "",
                      "resume_token": "",
                      "user_message": "",
                      "recovery_result_json": _json_text({"schema_version": "2.0", "status": "ready"}),
                      "web_search_context_json": _json_text(web_search_context),
                  }
              except Exception as exc:
                  return _recovery_result(
                      "fatal_internal",
                      "fatal_internal",
                      "UNEXPECTED_INPUT_ERROR",
                      exc,
                      "系统无法解析本次学习数据，请稍后重试。",
                  )
        appId: 12a0a7e2
        handlingEdge: normal_one_of::756cceba-3634-4d42-b003-4876cc6ac10b
        setAnswerContentErrMsg: ''
        exceptionHandlingEdge: fail_one_of::4c9a7596-256a-4ef1-b36d-17ac3ca5d586
