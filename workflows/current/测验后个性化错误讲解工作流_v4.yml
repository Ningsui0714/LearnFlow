        code: |-
          import json


          def _text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value.strip()
              return json.dumps(value, ensure_ascii=False, indent=2)


          def main(results, upstream_context):
              upstream_text = _text(upstream_context)
              result_text = _text(results)

              usable_upstream = upstream_text not in {"", "{}", "[]", "null"}
              usable_results = result_text not in {"", "{}", "[]", "null"}
              available = usable_upstream or usable_results

              parts = []
              if usable_upstream:
                  parts.append("【上游任务与教师依据】\n" + upstream_text)
              if usable_results:
                  parts.append("【平台知识库召回】\n" + result_text)

              kb_text = "\n\n".join(parts)
              if len(kb_text) > 16000:
                  kb_text = kb_text[:16000] + "\n[知识依据过长，已截断]"

              return {
                  "kb_available": available,
                  "kb_text": kb_text,
              }
