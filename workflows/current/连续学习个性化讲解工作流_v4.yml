      nodeParam:
        uid: '21880654528'
        code: |-
          import json
          import re
          from urllib.parse import urlparse


          MIN_LOCAL_SCORE = 0.35
          TRUSTED_DOMAIN_SUFFIXES = (
              "docs.python.org",
              "python.org",
              "learn.microsoft.com",
              "developer.mozilla.org",
              "w3.org",
              "ietf.org",
              "rfc-editor.org",
              "openstd.samr.gov.cn",
              "gov.cn",
              "moe.gov.cn",
              "mohrss.gov.cn",
              "xfyun.cn",
              "bilibili.com",
              "icourse163.org",
              "xuetangx.com",
              "smartedu.cn",
              "mooc1.cn",
              "youtube.com",
              "youtu.be",
          )


          def _text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value.strip()
              return json.dumps(value, ensure_ascii=False, indent=2)


          def _json_value(value, default):
              if value is None or value == "":
                  return default
              if isinstance(value, (dict, list)):
                  return value
              try:
                  return json.loads(str(value))
              except Exception:
                  return default


          def _keywords(query, target):
              values = [
                  str(query or ""),
                  str(target.get("knowledge_point_id", "")),
                  str(target.get("knowledge_point_name", "")),
                  str(target.get("error_type", "")),
              ]
              tokens = []
              for value in values:
                  tokens.extend(re.findall(r"[A-Za-z][A-Za-z0-9_.-]{1,}|[\u4e00-\u9fff]{2,}", value.lower()))
              return list(dict.fromkeys(token for token in tokens if len(token) >= 2))[:20]


          def _is_relevant(text, keywords, target):
              lowered = str(text or "").lower()
              knowledge_id = str(target.get("knowledge_point_id", "")).lower().strip()
              knowledge_name = str(target.get("knowledge_point_name", "")).lower().strip()
              if knowledge_id and knowledge_id in lowered:
                  return True
              if knowledge_name and knowledge_name in lowered:
                  return True
              if not keywords:
                  return len(lowered) >= 80
              return any(token in lowered for token in keywords)


          def _trusted_url(url):
              try:
                  host = urlparse(str(url)).hostname or ""
                  host = host.lower()
                  return any(host == suffix or host.endswith("." + suffix) for suffix in TRUSTED_DOMAIN_SUFFIXES)
              except Exception:
                  return False


          def _source_item(kind, title, locator, score=None):
              item = {"kind": kind, "title": str(title or "未命名来源"), "locator": str(locator or "")}
              if score is not None:
                  item["score"] = score
              return item


          def _local_evidence(results, keywords, target):
              accepted = []
              sources = []
              for item in results if isinstance(results, list) else []:
                  if not isinstance(item, dict):
                      continue
                  content = "\n".join(str(item.get(key, "")) for key in ("title", "content", "context"))
                  try:
                      score = float(item.get("score", 0) or 0)
                  except Exception:
                      score = 0.0
                  if score < MIN_LOCAL_SCORE or not _is_relevant(content, keywords, target):
                      continue
                  accepted.append(item)
                  sources.append(_source_item(
                      "knowledge_base",
                      item.get("title", "知识库文档"),
                      "kb://" + str(item.get("docId", "")),
                      round(score, 4),
                  ))
              return accepted, sources


          def _upstream_evidence(upstream_context, keywords, target):
              data = _json_value(upstream_context, {})
              if not isinstance(data, dict):
                  return None, []
              evidence_keys = {
                  "standard_answer", "teacher_reference", "safety_rules", "reference_materials",
                  "task_standard", "source", "sources", "official_reference",
              }
              if not any(key in data for key in evidence_keys):
                  return None, []
              text = _text(data)
              if len(text) < 80 or not _is_relevant(text, keywords, target):
                  return None, []
              source_name = data.get("source", data.get("official_reference", "上游教师/任务依据"))
              return data, [_source_item("upstream", source_name, "upstream://validated-context")]


          def _web_evidence(web_search_context, keywords, target):
              data = _json_value(web_search_context, {})
              if isinstance(data, dict):
                  items = data.get("results", data.get("items", []))
              elif isinstance(data, list):
                  items = data
              else:
                  items = []
              accepted = []
              sources = []
              for item in items if isinstance(items, list) else []:
                  if not isinstance(item, dict):
                      continue
                  url = item.get("url", item.get("link", ""))
                  title = item.get("title", "联网资料")
                  snippet = item.get("content", item.get("snippet", item.get("summary", "")))
                  combined = str(title) + "\n" + str(snippet)
                  if not _trusted_url(url) or len(str(snippet).strip()) < 40:
                      continue
                  if not _is_relevant(combined, keywords, target):
                      continue
                  accepted_item = dict(item)
                  accepted_item["title"] = title
                  accepted_item["url"] = url
                  accepted_item["content"] = snippet
                  accepted.append(accepted_item)
                  sources.append(_source_item("web", title, url))
              attempted = bool(_text(data).strip() not in {"", "{}", "[]", "null"})
              return accepted, sources, attempted


          def main(results, upstream_context, knowledge_query, target_error_json, web_search_context):
              target = _json_value(target_error_json, {})
              if not isinstance(target, dict):
                  target = {}
              keywords = _keywords(knowledge_query, target)
              local_items, local_sources = _local_evidence(results, keywords, target)
              upstream_item, upstream_sources = _upstream_evidence(upstream_context, keywords, target)
              web_items, web_sources, web_attempted = _web_evidence(web_search_context, keywords, target)

              parts = []
              sources = []
              if upstream_item:
                  parts.append("【已校验的上游教师/任务依据】\n" + _text(upstream_item))
                  sources.extend(upstream_sources)
              if local_items:
                  parts.append("【平台知识库高相关召回】\n" + _text(local_items))
                  sources.extend(local_sources)
              if web_items:
                  parts.append("【白名单官方联网资料】\n" + _text(web_items))
                  sources.extend(web_sources)

              available = bool(parts)
              if web_items:
                  evidence_status = "web_ready"
                  reason = "本地依据不足时已获得白名单官方联网资料"
              elif local_items:
                  evidence_status = "local_ready"
                  reason = "知识库召回达到相关性和分数阈值"
              elif upstream_item:
                  evidence_status = "upstream_ready"
                  reason = "已获得带来源标识的上游教师/任务依据"
              elif web_attempted:
                  evidence_status = "knowledge_unavailable"
                  reason = "联网检索已执行，但没有通过域名、内容长度和相关性校验的结果"
              else:
                  evidence_status = "needs_web_search"
                  reason = "本地知识库和上游依据均未达到质量阈值，需要调用聚合搜索插件"

              fallback_status = "needs_web_search" if evidence_status == "needs_web_search" else "knowledge_unavailable"
              kb_text = "\n\n".join(parts)
              if len(kb_text) > 16000:
                  kb_text = kb_text[:16000] + "\n[知识依据过长，已截断]"

              knowledge_result = {
                  "schema_version": "2.0",
                  "status": evidence_status,
                  "error_class": (
                      "" if available else
                      "system_retriable" if evidence_status == "needs_web_search" else
                      "fatal_internal"
                  ),
                  "retryable": evidence_status == "needs_web_search",
                  "system_action": (
                      "continue_generation" if available else
                      "call_web_search_and_resume" if evidence_status == "needs_web_search" else
                      "stop"
                  ),
                  "query": str(knowledge_query or "").strip(),
                  "reason": reason,
                  "sources": sources,
                  "allowed_domain_suffixes": list(TRUSTED_DOMAIN_SUFFIXES),
                  "required_web_search_schema": {
                      "web_search_context": {
                          "results": [{"title": "", "url": "", "snippet": ""}]
                      }
                  },
              }

              return {
                  "kb_available": available,
                  "kb_text": kb_text,
                  "evidence_status": evidence_status,
                  "evidence_reason": reason,
                  "web_search_query": str(knowledge_query or "").strip(),
                  "knowledge_result_json": json.dumps(knowledge_result, ensure_ascii=False, separators=(",", ":")),
                  "fallback_status": fallback_status,
              }
        appId: 12a0a7e2
