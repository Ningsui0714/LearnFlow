      nodeParam:
        uid: '21880654528'
        code: |
          # -*- coding: utf-8 -*-
          import json
          import re


          BLOCK_TYPES = {
              "concept", "text", "steps", "comparison", "example", "code_trace",
              "process", "warning", "weakness_connection", "workplace", "summary",
          }
          BLOCK_TYPE_ALIASES = {
              "definition": "concept",
              "explanation": "text",
              "list": "steps",
              "case": "example",
              "analogy": "comparison",
              "practice": "example",
              "interaction": "process",
              "interactive": "process",
              "tip": "warning",
              "code": "code_trace",
          }
          MODES = {
              "interactive_document", "video_interactive", "combined", "worked_example",
              "step_by_step", "execution_trace", "scenario_tree", "comparison",
              "steps_and_warning",
          }
          MODE_ALIASES = {
              "text": "interactive_document",
              "document": "interactive_document",
              "video": "video_interactive",
              "video_text": "combined",
              "video_and_text": "combined",
              "example": "worked_example",
              "steps": "step_by_step",
          }
          ACTIONS = {
              "not_understood", "show_example", "show_steps", "switch_explanation",
              "request_video", "request_text", "start_check", "continue_learning",
          }


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"), default=str)


          def _load_json(value, name="输入", allow_empty=False):
              if isinstance(value, dict):
                  return value
              if value is None or value == "":
                  if allow_empty:
                      return {}
                  raise ValueError(name + " 不能为空")
              text = str(value or "").strip()
              if not text and allow_empty:
                  return {}
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError(name + " 中未找到 JSON 对象")
              result = json.loads(text[start:end + 1])
              if not isinstance(result, dict):
                  raise ValueError(name + " 必须是 Object")
              return result


          def _load_model_output(value):
              result = _load_json(value, "大模型输出")
              if "status" in result or "lesson_title" in result:
                  return result
              for key in ("output", "content", "text", "data"):
                  nested = result.get(key)
                  if isinstance(nested, dict):
                      return nested
                  if isinstance(nested, str) and nested.strip():
                      try:
                          return _load_json(nested, "大模型输出." + key)
                      except Exception:
                          pass
              return result


          def _safe_input_json(value):
              try:
                  return _json_text(_load_json(value, allow_empty=True))
              except Exception:
                  return "{}"


          def _failure(message, strategy_json, target_json, evidence_json):
              error_message = str(message)
              strategy_text = _safe_input_json(strategy_json)
              target_text = _safe_input_json(target_json)
              evidence_text = _safe_input_json(evidence_json)
              final_result = {
                  "status": "system_retryable",
                  "workflow_mode": "learning",
                  "retryable": True,
                  "retry_stage": "learning_lesson_generation",
                  "teaching_plan": {},
                  "content_blocks": [],
                  "resources": [],
                  "check_request": {},
                  "path_update": {},
                  "learning_strategy_json": strategy_text,
                  "learning_target_json": target_text,
                  "evidence_json": evidence_text,
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
                  "error_message": error_message,
              }
              return {
                  "output_valid": False,
                  "status": "system_retryable",
                  "personalized_explanation": "",
                  "understanding_check_text": "",
                  "final_result_json": _json_text(final_result),
                  "error_message": error_message,
                  "learning_strategy_json": strategy_text,
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
              }


          def _block_text(block):
              content = str(
                  block.get("content", block.get("text", block.get("description", "")))
              ).strip()
              items = block.get("items", block.get("steps", []))
              if isinstance(items, list) and items:
                  content = "；".join(str(item) for item in items)
              return content


          def main(model_output="", strategy_json="", learning_target_json="", context_json="", evidence_json=""):
              try:
                  result = _load_model_output(model_output)
                  strategy_bundle = _load_json(strategy_json, "学习策略", allow_empty=True)
                  target = _load_json(learning_target_json, "学习目标", allow_empty=True)
                  context = _load_json(context_json, "学习上下文", allow_empty=True)
                  evidence = _load_json(evidence_json, "知识依据", allow_empty=True)
                  if str(result.get("status", "")) != "ok":
                      raise ValueError("status 必须为 ok")

                  title = str(result.get("lesson_title", "")).strip()
                  objective = str(result.get("lesson_objective", "")).strip()
                  if not title or not objective:
                      raise ValueError("lesson_title 和 lesson_objective 不能为空")

                  plan = result.get("teaching_plan", {})
                  if not isinstance(plan, dict):
                      raise ValueError("teaching_plan 必须是 Object")
                  mode = str(plan.get("primary_mode", "")).strip()
                  mode = MODE_ALIASES.get(mode, mode)
                  if mode not in MODES:
                      strategy_plan = strategy_bundle.get("teaching_plan", {})
                      if isinstance(strategy_plan, dict):
                          strategy_mode = str(strategy_plan.get("primary_mode", "")).strip()
                          mode = MODE_ALIASES.get(strategy_mode, strategy_mode)
                  if mode not in MODES:
                      raise ValueError("teaching_plan.primary_mode 不在允许枚举中")
                  plan["primary_mode"] = mode
                  if not str(plan.get("reason", "")).strip():
                      raise ValueError("teaching_plan.reason 不能为空")

                  blocks = result.get("content_blocks", [])
                  if not isinstance(blocks, list) or len(blocks) < 3:
                      raise ValueError("content_blocks 至少包含3个内容块")
                  normalized_blocks = []
                  for index, block in enumerate(blocks):
                      if not isinstance(block, dict):
                          raise ValueError("content_blocks 元素必须是 Object")
                      block_type = str(block.get("type", "")).strip()
                      block_type = BLOCK_TYPE_ALIASES.get(block_type, block_type)
                      if block_type not in BLOCK_TYPES:
                          raise ValueError("content_blocks[" + str(index) + "].type 不在允许枚举中")
                      block["type"] = block_type
                      if not str(block.get("title", "")).strip():
                          block["title"] = "教学内容" + str(index + 1)
                      if not str(block.get("title", "")).strip() or not _block_text(block):
                          raise ValueError("content_blocks 必须包含 title 以及 content 或 items")
                      normalized_blocks.append(block)

                  resources = result.get("resources", [])
                  if not isinstance(resources, list):
                      raise ValueError("resources 必须是 Array")
                  normalized_resources = []
                  for resource in resources:
                      if not isinstance(resource, dict):
                          continue
                      url = str(resource.get("url", "")).strip()
                      source = str(resource.get("source", "")).strip()
                      if url and not (url.startswith("https://") or url.startswith("http://")):
                          continue
                      if url and not source:
                          continue
                      normalized_resources.append(resource)

                  check = result.get("check_request", {})
                  if not isinstance(check, dict):
                      check = {}
                  if not str(check.get("focus", "")).strip():
                      check["focus"] = objective
                  knowledge_id = str(
                      target.get("knowledge_point_id", "")
                      or check.get("knowledge_point_id", "")
                  )
                  check["knowledge_point_id"] = knowledge_id

                  path_update = result.get("path_update", {})
                  if not isinstance(path_update, dict):
                      path_update = {}
                  actions = result.get("actions", [])
                  if not isinstance(actions, list):
                      actions = []
                  actions = [str(action) for action in actions if str(action) in ACTIONS]
                  if "start_check" not in actions:
                      actions.append("start_check")

                  student_id = str(context.get("student_id", ""))
                  session_id = str(context.get("session_id", ""))
                  lesson_run_id = str(context.get("attempt_id", ""))
                  event_type = str(context.get("event_type", ""))
                  memory = result.get("memory_writeback", {})
                  if not isinstance(memory, dict):
                      memory = {}
                  database = result.get("database_writeback", {})
                  if not isinstance(database, dict):
                      database = {}
                  common = {
                      "student_id": student_id,
                      "session_id": session_id,
                      "lesson_run_id": lesson_run_id,
                      "knowledge_point_id": knowledge_id,
                      "teaching_mode": mode,
                      "effect": "pending",
                  }
                  memory.update(common)
                  database.update(common)

                  preview_parts = [title, objective]
                  for block in normalized_blocks[:4]:
                      block_preview = _block_text(block)
                      if len(block_preview) > 360:
                          block_preview = block_preview[:360] + "……"
                      preview_parts.append(str(block.get("title", "")) + "：" + block_preview)
                  preview = "\n\n".join(preview_parts)
                  check_text = "完成本节后进入阶段检查：" + str(check.get("focus", ""))
                  final_result = {
                      "status": "ok",
                      "workflow_mode": "learning",
                      "event_type": event_type,
                      "lesson_id": lesson_run_id + "-" + knowledge_id,
                      "lesson_title": title,
                      "lesson_objective": objective,
                      "teaching_plan": plan,
                      "content_blocks": normalized_blocks,
                      "resources": normalized_resources,
                      "resource_gap": str(result.get("resource_gap", "")),
                      "check_request": check,
                      "path_update": path_update,
                      "actions": actions,
                      "sources": result.get("sources", []),
                      "learning_strategy_json": _json_text(strategy_bundle),
                      "learning_target_json": _json_text(target),
                      "evidence_json": _json_text(evidence),
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                      "error_message": "",
                  }
                  return {
                      "output_valid": True,
                      "status": "ok",
                      "personalized_explanation": preview,
                      "understanding_check_text": check_text,
                      "final_result_json": _json_text(final_result),
                      "error_message": "",
                      "learning_strategy_json": _json_text(strategy_bundle),
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                  }
              except Exception as exc:
                  return _failure(exc, strategy_json, learning_target_json, evidence_json)
        appId: 12a0a7e2
        codeErrMsg: ''
