        code: |
          import json


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _number(value, default=0):
              try:
                  return float(value)
              except Exception:
                  return float(default)


          def _mastery(value):
              result = _number(value, 0)
              if 0 <= result <= 1:
                  result *= 100
              return max(0.0, min(100.0, result))


          def _history_for(history, knowledge_id):
              events = history.get("events", history.get("previous_explanations", []))
              if not isinstance(events, list):
                  return []
              return [
                  item for item in events
                  if isinstance(item, dict)
                  and str(item.get("knowledge_point_id", "")) == knowledge_id
              ]


          def _path_items(context):
              path = context.get("learning_path", {})
              items = path.get("items", []) if isinstance(path, dict) else []
              if not isinstance(items, list) or not items:
                  items = context.get("weak_points", [])
              items = [dict(item) for item in items if isinstance(item, dict)]
              items.sort(key=lambda item: (
                  1 if str(item.get("status", "")) in {"mastered", "completed"} else 0,
                  0 if bool(item.get("safety_critical", False)) else 1,
                  _number(item.get("recommended_order", 999), 999),
                  -_number(item.get("priority", item.get("severity_score", 0)), 0),
              ))
              return items


          def main(context_json):
              context = json.loads(context_json or "{}")
              event_type = str(context.get("event_type", "initialize_learning"))
              target = context.get("current_knowledge_point", {})
              knowledge_id = str(target.get("knowledge_point_id", ""))
              knowledge_name = str(target.get("knowledge_point_name", knowledge_id))
              history = context.get("teaching_history", {})
              target_history = _history_for(history, knowledge_id)
              check_result = context.get("check_result", {})
              preferences = context.get("resource_preferences", {})

              mastery = _mastery(target.get("mastery", context.get("knowledge_state", {}).get("mastery", 0)))
              attempt_count = int(_number(target.get("attempt_count", len(target_history)), len(target_history)))
              ineffective = []
              used_modes = []
              for item in target_history:
                  mode = str(item.get("teaching_mode", item.get("strategy", ""))).strip()
                  if mode:
                      used_modes.append(mode)
                  if str(item.get("effect", "")) in {"ineffective", "not_understood", "failed"} and mode:
                      ineffective.append(mode)
              for mode in history.get("ineffective_modes", []):
                  if str(mode) and str(mode) not in ineffective:
                      ineffective.append(str(mode))

              if mastery < 40:
                  depth = "foundational"
              elif mastery < 70:
                  depth = "guided"
              elif mastery < 85:
                  depth = "concise"
              else:
                  depth = "transfer"

              knowledge_type = str(target.get("knowledge_type", "conceptual"))
              default_modes = {
                  "conceptual": "interactive_document",
                  "procedural": "video_interactive",
                  "operation": "video_interactive",
                  "code": "execution_trace",
                  "diagnostic": "scenario_tree",
                  "safety": "steps_and_warning",
              }
              primary_mode = default_modes.get(knowledge_type, "combined")
              strategy_code = "path_guided_teaching"
              requested_mode = str(preferences.get("requested_mode", ""))

              if event_type == "request_video":
                  primary_mode = "video_interactive"
                  strategy_code = "requested_video"
              elif event_type == "request_text":
                  primary_mode = "interactive_document"
                  strategy_code = "requested_text"
              elif event_type == "show_example":
                  primary_mode = "worked_example"
                  strategy_code = "worked_example"
              elif event_type == "show_steps":
                  primary_mode = "step_by_step"
                  strategy_code = "step_by_step"
              elif event_type == "switch_explanation" or str(check_result.get("status", "")) in {"incorrect", "not_understood"}:
                  strategy_code = "alternative_representation"
                  candidates = [
                      "execution_trace", "comparison", "worked_example",
                      "video_interactive", "scenario_tree", "interactive_document",
                  ]
                  primary_mode = next((mode for mode in candidates if mode not in ineffective and mode not in used_modes[-1:]), "worked_example")
              elif requested_mode in {"video_interactive", "interactive_document", "combined"}:
                  primary_mode = requested_mode

              prerequisite_gap = target.get("prerequisite_gap", target.get("prerequisite_ids", []))
              if isinstance(prerequisite_gap, str):
                  prerequisite_gap = [prerequisite_gap] if prerequisite_gap.strip() else []
              elif prerequisite_gap is True:
                  prerequisite_gap = ["存在未明确的前置知识缺口"]
              elif prerequisite_gap in (False, None):
                  prerequisite_gap = []
              elif not isinstance(prerequisite_gap, (list, tuple, set)):
                  prerequisite_gap = [str(prerequisite_gap)]
              if prerequisite_gap and mastery < 50 and event_type not in {"request_video", "request_text"}:
                  strategy_code = "prerequisite_repair"

              alternatives = [
                  mode for mode in ["interactive_document", "video_interactive", "worked_example", "step_by_step"]
                  if mode != primary_mode and mode not in ineffective
              ][:3]
              reason_parts = ["当前掌握度为" + str(round(mastery, 1)) + "%"]
              if attempt_count:
                  reason_parts.append("已学习或练习" + str(attempt_count) + "次")
              if ineffective:
                  reason_parts.append("避开无效方式：" + "、".join(ineffective))
              if prerequisite_gap:
                  reason_parts.append("存在前置知识缺口")

              path_items = _path_items(context)
              for item in path_items:
                  if str(item.get("knowledge_point_id", "")) == knowledge_id:
                      item["status"] = "current"
              next_item = next((
                  item for item in path_items
                  if str(item.get("knowledge_point_id", "")) != knowledge_id
                  and str(item.get("status", "")) not in {"mastered", "completed"}
              ), {})
              path_plan = {
                  "goal": context.get("learning_goal", {}),
                  "items": path_items,
                  "current_knowledge_point_id": knowledge_id,
                  "next_knowledge_point_id": str(next_item.get("knowledge_point_id", "")),
              }
              teaching_plan = {
                  "workflow_mode": "learning",
                  "event_type": event_type,
                  "strategy_code": strategy_code,
                  "depth": depth,
                  "primary_mode": primary_mode,
                  "alternative_modes": alternatives,
                  "reason": "；".join(reason_parts),
                  "avoid_modes": ineffective,
                  "include_concept": True,
                  "include_example": True,
                  "include_workplace_application": True,
                  "include_stage_check_request": True,
                  "do_not_score_here": True,
              }
              query_parts = [
                  "学习目标=" + str(context.get("learning_goal", {}).get("goal_name", "")),
                  "知识点ID=" + knowledge_id,
                  "知识点名称=" + knowledge_name,
                  "知识类型=" + knowledge_type,
                  "教学深度=" + depth,
                  "主要教学形式=" + primary_mode,
                  "薄弱证据=" + str(target.get("error_evidence", target.get("weakness_evidence", ""))),
                  "前置缺口=" + ",".join(str(x) for x in prerequisite_gap),
                  "检索要求=定义、前置知识、标准步骤、最小示例、常见误区、岗位应用、权威来源、已审核视频或互动资源链接",
              ]
              return {
                  "strategy_code": strategy_code,
                  "delivery_mode": primary_mode,
                  "explanation_depth": depth,
                  "knowledge_query": "\n".join(query_parts),
                  "teaching_strategy_json": _json_text(teaching_plan),
                  "learning_target_json": _json_text(target),
                  "mastery": round(mastery, 2),
                  "wrong_streak": int(_number(target.get("wrong_streak", 0), 0)),
                  "correct_streak": int(_number(target.get("correct_streak", 0), 0)),
                  "need_retry": False,
                  "need_variant": False,
                  "resume_focus": str(context.get("learning_path", {}).get("resume_focus", "")),
                  "workflow_mode": "learning",
                  "learning_strategy_json": _json_text({
                      "teaching_plan": teaching_plan,
                      "path_plan": path_plan,
                      "learning_target": target,
                  }),
              }
        appId: 12a0a7e2
