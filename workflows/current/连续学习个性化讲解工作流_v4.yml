      nodeParam:
        uid: '21880654528'
        code: |
          # -*- coding: utf-8 -*-
          import json
          import re


          EVENT_TYPES = {
              "initialize_learning",
              "open_lesson",
              "continue_learning",
              "show_example",
              "show_steps",
              "switch_explanation",
              "request_video",
              "request_text",
              "check_feedback",
          }


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _load_json(value):
              if isinstance(value, dict):
                  return value
              text = str(value or "").strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError("未找到 JSON 对象")
              result = json.loads(text[start:end + 1])
              if not isinstance(result, dict):
                  raise ValueError("输入必须是 Object")
              return result


          def _object_field(data, name, default=None):
              if default is None:
                  default = {}
              value = data.get(name, data.get(name + "_json", default))
              if value is None or value == "":
                  return default
              if isinstance(value, str):
                  value = _load_json(value)
              if not isinstance(value, dict):
                  raise ValueError(name + " 必须是 Object")
              return value


          def _list_field(data, name, default=None):
              if default is None:
                  default = []
              value = data.get(name, default)
              if value is None or value == "":
                  return default
              if isinstance(value, str):
                  try:
                      value = json.loads(value)
                  except Exception:
                      raise ValueError(name + " 必须是 Array")
              if not isinstance(value, list):
                  raise ValueError(name + " 必须是 Array")
              return value


          def _web_context(data):
              value = data.get("web_search_context", data.get("web_search_results", {}))
              if value is None or value == "":
                  return {}
              if isinstance(value, str):
                  try:
                      return json.loads(value)
                  except Exception:
                      return {"text": value}
              return value if isinstance(value, (dict, list)) else {"text": str(value)}


          def _base_result():
              return {
                  "is_valid": False,
                  "error_message": "",
                  "normalized_context_json": "{}",
                  "route_type": "",
                  "evaluation_status": "",
                  "knowledge_context_json": "{}",
                  "student_id": "",
                  "session_id": "",
                  "attempt_id": "",
                  "recovery_status": "fatal_internal",
                  "error_class": "fatal_internal",
                  "error_code": "INVALID_LEARNING_CONTEXT",
                  "missing_fields_json": "[]",
                  "clarification_question": "",
                  "resume_token": "",
                  "user_message": "上游学习诊断数据不完整，暂时无法生成本轮教学内容。",
                  "recovery_result_json": "{}",
                  "web_search_context_json": "{}",
                  "workflow_mode": "learning",
                  "learning_target_json": "{}",
                  "learning_state_json": "{}",
                  "learner_action": "",
              }


          def _failure(code, message, missing_fields=None, data=None):
              result = _base_result()
              missing_fields = missing_fields or []
              user_message = "上游学习诊断数据不完整，暂时无法生成本轮教学内容。"
              result.update({
                  "error_message": str(message),
                  "error_code": code,
                  "missing_fields_json": _json_text(missing_fields),
                  "user_message": user_message,
                  "recovery_result_json": _json_text({
                      "schema_version": "4.0",
                      "status": "fatal_internal",
                      "workflow_mode": "learning",
                      "error_code": code,
                      "message": user_message,
                      "missing_fields": missing_fields,
                  }),
              })
              if isinstance(data, dict):
                  result["student_id"] = str(data.get("student_id", ""))
                  result["session_id"] = str(data.get("session_id", ""))
                  result["attempt_id"] = str(data.get("lesson_run_id", ""))
                  result["route_type"] = str(data.get("event_type", ""))
                  result["web_search_context_json"] = _json_text(_web_context(data))
              return result


          def _select_target(data, weak_points, path_state):
              current = _object_field(data, "current_knowledge_point")
              current_id = str(current.get("knowledge_point_id", "")).strip()
              if current_id:
                  return current
              path_items = path_state.get("items", [])
              if isinstance(path_items, list):
                  for item in path_items:
                      if isinstance(item, dict) and str(item.get("status", "")) not in {"mastered", "completed"}:
                          return item
              for item in weak_points:
                  if isinstance(item, dict) and str(item.get("knowledge_point_id", "")).strip():
                      return item
              return {}


          def main(raw_input):
              try:
                  data = _load_json(raw_input)
                  missing = [key for key in ("student_id", "session_id") if not str(data.get(key, "")).strip()]
                  if missing:
                      return _failure("MISSING_SYSTEM_FIELD", "缺少系统字段: " + ",".join(missing), missing, data)

                  event_type = str(data.get("event_type", "initialize_learning")).strip()
                  if event_type not in EVENT_TYPES:
                      return _failure("INVALID_EVENT_TYPE", "event_type 不在允许枚举中", ["event_type"], data)

                  learning_goal = _object_field(data, "learning_goal")
                  if not str(learning_goal.get("goal_id", learning_goal.get("goal_name", ""))).strip():
                      return _failure("MISSING_LEARNING_GOAL", "上游未提供学习目标", ["learning_goal"], data)

                  diagnostic = _object_field(data, "diagnostic_result")
                  weak_points = _list_field(diagnostic, "weak_points", _list_field(data, "weak_points"))
                  path_state = _object_field(data, "learning_path")
                  target = _select_target(data, weak_points, path_state)
                  target_id = str(target.get("knowledge_point_id", "")).strip()
                  if not target_id:
                      return _failure(
                          "MISSING_LEARNING_TARGET",
                          "上游没有提供可学习的薄弱知识点",
                          ["diagnostic_result.weak_points", "current_knowledge_point"],
                          data,
                      )

                  target["knowledge_point_id"] = target_id
                  target["knowledge_point_name"] = str(
                      target.get("knowledge_point_name", target.get("name", target_id))
                  )

                  teaching_history = _object_field(data, "teaching_history")
                  knowledge_state = _object_field(data, "knowledge_state")
                  check_result = _object_field(data, "check_result")
                  resource_preferences = _object_field(data, "resource_preferences")
                  knowledge_context = _object_field(data, "knowledge_context")
                  lesson_run_id = str(data.get("lesson_run_id", "LEARN-" + str(data["session_id"])))

                  learning_state = {
                      "learning_goal": learning_goal,
                      "diagnostic_result": diagnostic,
                      "weak_points": weak_points,
                      "learning_path": path_state,
                      "current_knowledge_point": target,
                      "teaching_history": teaching_history,
                      "knowledge_state": knowledge_state,
                      "check_result": check_result,
                      "resource_preferences": resource_preferences,
                  }
                  normalized = {
                      "schema_version": "4.0",
                      "workflow_mode": "learning",
                      "student_id": str(data["student_id"]),
                      "session_id": str(data["session_id"]),
                      "attempt_id": lesson_run_id,
                      "event_type": event_type,
                      "route_type": event_type,
                      "learning_goal": learning_goal,
                      "diagnostic_result": diagnostic,
                      "weak_points": weak_points,
                      "learning_path": path_state,
                      "current_knowledge_point": target,
                      "teaching_history": teaching_history,
                      "knowledge_state": knowledge_state,
                      "check_result": check_result,
                      "resource_preferences": resource_preferences,
                      "knowledge_context": knowledge_context,
                      "web_search_context": _web_context(data),
                  }
                  status = str(check_result.get("status", ""))
                  return {
                      "is_valid": True,
                      "error_message": "",
                      "normalized_context_json": _json_text(normalized),
                      "route_type": event_type,
                      "evaluation_status": status,
                      "knowledge_context_json": _json_text(knowledge_context),
                      "student_id": str(data["student_id"]),
                      "session_id": str(data["session_id"]),
                      "attempt_id": lesson_run_id,
                      "recovery_status": "ready",
                      "error_class": "",
                      "error_code": "",
                      "missing_fields_json": "[]",
                      "clarification_question": "",
                      "resume_token": "",
                      "user_message": "",
                      "recovery_result_json": _json_text({
                          "schema_version": "4.0",
                          "status": "ready",
                          "workflow_mode": "learning",
                          "event_type": event_type,
                      }),
                      "web_search_context_json": _json_text(_web_context(data)),
                      "workflow_mode": "learning",
                      "learning_target_json": _json_text(target),
                      "learning_state_json": _json_text(learning_state),
                      "learner_action": event_type,
                  }
              except Exception as exc:
                  return _failure("INVALID_LEARNING_CONTEXT", exc)
        appId: 12a0a7e2
        handlingEdge: normal_one_of::756cceba-3634-4d42-b003-4876cc6ac10b
        setAnswerContentErrMsg: ''
