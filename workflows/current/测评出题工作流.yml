      nodeParam:
        code: |
          import json


          def main(raw_input):
              data = json.loads(str(raw_input or "{}"), strict=False)
              if not isinstance(data, dict):
                  raise ValueError("入参必须是 JSON 对象")
              goal = data.get("learning_goal", {}) or {}
              weak_points = data.get("weak_points", [])
              if not isinstance(weak_points, list):
                  weak_points = []
              kb_text = str(data.get("kb_text", "") or "")
              return {
                  "goal_name": str(goal.get("goal_name", "") or ""),
                  "weak_points_json": json.dumps(weak_points, ensure_ascii=False),
                  "kb_text": kb_text,
              }
