              id: 937eeb65-8290-5f84-a424-83550598a058
              nodeId: facd84ec-0a10-5b83-ba89-898b04978e26
            contentErrMsg: ''
        nameErrMsg: ''
        fileType: ''
      outputs:
      - id: f6b89512-5e3f-5e6a-b1ad-ca8333c8043e
        name: final_result_json
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |
          import json


          def main(raw_input):
              data = json.loads(str(raw_input or "{}"), strict=False)
              if not isinstance(data, dict):
                  return {"status": "system_retryable", "questions": []}
              questions = data.get("questions", [])
              if not isinstance(questions, list) or not questions:
                  return {"status": "system_retryable", "questions": []}
              cleaned = []
              for q in questions[:8]:
                  if not isinstance(q, dict):
                      continue
                  title = str(q.get("question", "") or "").strip()
                  options = q.get("options", [])
                  answer = str(q.get("answer", "") or "").strip()
                  if title and isinstance(options, list) and len(options) >= 2 and answer:
                      cleaned.append({
                          "question": title,
                          "options": [str(o) for o in options[:6]],
                          "answer": answer,
                          "knowledge_point_id": str(q.get("knowledge_point_id", "") or ""),
                          "difficulty": int(q.get("difficulty", 2) or 2),
                      })
              if not cleaned:
                  return {"status": "system_retryable", "questions": []}
              return {"status": "ok", "questions": cleaned}
        appId: 12a0a7e2
        uid: '21880654528'
        codeErrMsg: ''
      updatable: false
      status: ''
      references: []
      labelEdit: false
      icon: 
        https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
      description: 面向开发者提供 Python 代码执行能力。
    dragging: false
    selected: false
