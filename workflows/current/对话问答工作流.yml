          - id: 'out::af8274eb-a72a-4421-999b-b0de7b973cfd'
            name: history_memory
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            
            def main(raw_input):
                try:
                    data = json.loads(str(raw_input or "{}"))
                    if not isinstance(data, dict):
                        data = {}
                except Exception:
                    data = {}
                message = str(data.get("message") or "").strip()
                if not message:
                    raise ValueError("message 不能为空")
                student_id = str(data.get("student_id") or "")
                kb_text = str(data.get("kb_text") or "")
                history = data.get("history_memory") or []
                if not isinstance(history, list):
                    history = []
                return {
                    "message": message,
                    "student_id": student_id,
                    "kb_text": kb_text,
                    "history_memory": json.dumps(history, ensure_ascii=False),
                }
          appId: 12a0a7e2
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
