            schema: {type: string, default: 'none'}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            
            def _parse_input(raw_input):
                value = raw_input
                for _ in range(3):
                    if isinstance(value, dict):
                        if "input" in value:
                            value = value.get("input")
                            continue
                        if "AGENT_USER_INPUT" in value:
                            value = value.get("AGENT_USER_INPUT")
                            continue
                        return value
                    text = str(value or "").strip()
                    if not text:
                        return {}
                    value = json.loads(text, strict=False)
                if not isinstance(value, dict):
                    raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
                return value

            def main(raw_input):
                try:
                    data = _parse_input(raw_input)
                    if not isinstance(data, dict):
                        data = {}
                except Exception:
                    data = {}
                message = str(data.get("message") or "").strip()
                if not message:
                    raise ValueError("message 不能为空")
                student_id = str(data.get("student_id") or "")
                student_profile = data.get("student_profile") or {}
                if not isinstance(student_profile, dict):
                    student_profile = {}
                kb_text = str(data.get("kb_text") or "")
                history = data.get("history_memory") or []
                if not isinstance(history, list):
                    history = []
                assistant_mode = str(data.get("assistant_mode") or "education").strip().lower()
                if assistant_mode not in ("education", "general"):
                    assistant_mode = "education"
                source_kind = str(data.get("source_kind") or "none").strip().lower()
                return {
                    "message": message,
                    "student_id": student_id,
                    "student_profile": json.dumps(student_profile, ensure_ascii=False),
                    "kb_text": kb_text,
                    "history_memory": json.dumps(history, ensure_ascii=False),
                    "assistant_mode": assistant_mode,
                    "source_kind": source_kind,
                }
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
