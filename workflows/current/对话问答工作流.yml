      nodeParam:
        code: |
          import json


          def main(raw_input):
              data = json.loads(str(raw_input or "{}"), strict=False)
              if not isinstance(data, dict):
                  return {"status": "system_retryable", "message": "生成结果非法 JSON"}
              answer = str(data.get("answer", "") or "").strip()
              if not answer:
                  return {"status": "system_retryable", "message": "回答为空"}
              return {
                  "status": "ok",
                  "message": answer[:2000],
                  "ai_generated": True,
                  "sources": data.get("sources", []),
              }
