                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
          - id: '9e3dd933-5cfb-4d4f-b2a8-849431bb1e1c'
            name: message
            schema:
              type: string
              value:
                type: ref
                content: {name: message, id: '5ec32e5c-13a5-4372-998d-6f7929a98b4a', nodeId: 'ifly-code::150e40ef-1533-4a41-8c75-974252ba1ca0'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 'a2af24ca-6a7c-4431-8783-7a62f0f756a4'
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re
            
            def main(model_output, message):
                text = str(model_output or "").strip()
                text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
                start, end = text.find("{"), text.rfind("}")
                if start < 0 or end < start:
                    raise ValueError("大模型输出中未找到 JSON 对象")
                try:
                    result = json.loads(text[start:end + 1], strict=False)
                except Exception:
                    result = {}
                answer = str(result.get("answer") or "").strip()
                if not answer:
                    answer = "知识库暂未覆盖该问题，建议先进入学情诊断定位薄弱知识点。"
                if len(answer) > 2000:
                    answer = answer[:2000]
                sources = result.get("sources") or []
                if not isinstance(sources, list):
                    sources = []
                output = {
                    "status": "ok",
                    "message": answer,
                    "ai_generated": True,
                    "sources": sources[:3],
                    "original_question": message,
                }
                return {"final_result_json": json.dumps(output, ensure_ascii=False, separators=(",", ":"))}
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
        labelEdit: false
        icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
        description: 面向开发者提供 Python 代码执行能力。
