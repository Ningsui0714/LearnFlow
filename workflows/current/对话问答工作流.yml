        name: kb_text
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |
          import json


          def main(raw_input):
              data = json.loads(str(raw_input or "{}"), strict=False)
              if not isinstance(data, dict):
                  raise ValueError("入参必须是 JSON 对象")
              message = str(data.get("message", "")).strip()
              if not message:
                  raise ValueError("message 不能为空")
              student_id = str(data.get("student_id", "")).strip()
              profile = data.get("student_profile", {}) or {}
              kb_text = str(data.get("kb_text", "") or "")
              return {
                  "student_id": student_id,
                  "message": message,
                  "profile_json": json.dumps(profile, ensure_ascii=False),
                  "kb_text": kb_text,
              }
        appId: 12a0a7e2
        uid: '21880654528'
        codeErrMsg: ''
      updatable: false
      status: ''
      references: []
      labelEdit: false
      icon: 
