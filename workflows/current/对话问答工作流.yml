    - id: 'ifly-code::df6ab890-5252-4709-8d00-6d13d6bdf022'
      type: 代码
      position: {x: 1140, y: 200}
      positionAbsolute: {x: 1140, y: 200}
      width: 362
      height: 100
      data:
        allowInputReference: true
        allowOutputReference: true
        label: 校验回答输出
        nodeMeta: {aliasName: 代码, nodeType: 工具}
        inputs:
          - id: 'in::08f0d1ee-f1d2-4465-9317-2bab02fd594e'
            name: model_output
            schema:
              type: string
              value:
                type: ref
                content: {name: output, id: 'out::9a003b90-1915-4bee-9904-b099780dff19', nodeId: 'spark-llm::3b41e154-88d1-45bb-80e3-4e95a322b34f'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
          - id: 'in::9e3dd933-5cfb-4d4f-b2a8-849431bb1e1c'
            name: message
            schema:
              type: string
              value:
                type: ref
                content: {name: message, id: 'out::7c666084-3b8f-4534-a15e-5b9ed0cabdf1', nodeId: 'ifly-code::150e40ef-1533-4a41-8c75-974252ba1ca0'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 'out::a2af24ca-6a7c-4431-8783-7a62f0f756a4'
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re
            
            def main(model_output, message):
                text = str(model_output or "").strip()
                text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
                start, end = text.find("{"), text.rfind("}")
                if start < 0 or end < start:
                    raise ValueError("大模型输出中未找到 JSON 对象")
                try:
                    result = json.loads(text[start:end + 1], strict=False)
                except Exception:
                    result = {}
                answer = str(result.get("answer") or "").strip()
                if not answer:
                    answer = "知识库暂未覆盖该问题，建议先进入学情诊断定位薄弱知识点。"
                if len(answer) > 2000:
                    answer = answer[:2000]
                sources = result.get("sources") or []
                if not isinstance(sources, list):
                    sources = []
                output = {
                    "status": "ok",
                    "message": answer,
                    "ai_generated": True,
                    "sources": sources[:3],
                    "original_question": message,
                }
                return {"final_result_json": json.dumps(output, ensure_ascii=False, separators=(",", ":"))}
          appId: 12a0a7e2
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
        labelEdit: false
        icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
        description: 面向开发者提供 Python 代码执行能力。
      dragging: false
      selected: false
