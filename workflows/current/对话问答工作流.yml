        nodeParam:
          topK: 4
          template: |-
              学生提问
              {{message}}
              
              本地知识库检索结果（仅此为依据，不得使用外部知识）
              {{kb_text}}
              
              最近对话历史
              {{history_memory}}
          enableChatHistoryV2: {isEnabled: false, rounds: 1}
          auditing: default
          llmId: 110
          url: 'wss://spark-api.xf-yun.com/v4.0/chat'
          domain: 4.0Ultra
          maxTokens: 2048
          temperature: 0.4
          model: spark
          serviceId: bm4
          respFormat: 0
          systemTemplate: |-
              你是职业教育"Java 面向对象程序设计"课程的智能辅导助手。
              
              回答要求：
              1. 只用 {{kb_text}} 中的内容回答，不得编造 kb_text 之外的知识；kb_text 为空时明确告知"知识库暂未覆盖，建议先进入学情诊断"，并给出 2-3 个可追问的方向。
              2. 语言口语化、分步骤，贴合高职学生认知；避免术语堆砌；必要时给出一行 Java 代码示例。
              3. 结合 {{history_memory}} 中的上文：若学生用"那/它/这个"等指代提问，按上文主题作答；不要重复上轮已回答的内容。
              4. 若学生提问与 Java/课程无关，礼貌说明本助手专注该课程范围。
              5. 只输出一个合法 JSON 对象（不输出 Markdown 代码块），格式严格如下：
              {"answer": "口语化回答，不超过 500 字", "sources": [{"title": "依据的知识库条目标题", "locator": "来源定位"}]}
              sources 最多 3 条，必须来自 kb_text；无依据时 sources 为空数组。
